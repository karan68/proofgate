name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check WASM scorer formatting
        run: cargo fmt --manifest-path wasm-scorer/Cargo.toml -- --check

      - name: Test WASM scorer
        run: npm run wasm:test

      - name: Verify committed WASM artifact
        run: npm run wasm:verify

      - name: Benchmark WASM scorer
        run: npm run wasm:benchmark

      - name: Build WASM scorer from source
        run: npm run wasm:build

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build MCP server
        run: npm run mcp:build

      - name: Audit dependencies
        run: npm audit --audit-level=high
